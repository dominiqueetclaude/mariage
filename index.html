<!DOCTYPE html>

<meta charset="utf-8">

<title>Votre table – Mariage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#2b2540;--muted:#6d6785;--accent:#2b69ba;--card:#ffffff;--line:#d9d4e4}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a2b;--ink:#eeeaf6;--muted:#a49dbd;--accent:#d7b8e0;--card:#27233a;--line:#3d3857}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Jost",system-ui,sans-serif;display:flex;justify-content:center;padding:48px 20px}
main{width:100%;max-width:440px;text-align:center}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:clamp(2rem,10vw,3rem);line-height:1;margin:0 0 20px;letter-spacing:.01em;color:var(--accent)}
.date{color:var(--muted);margin:0 0 40px}
.intro{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.8rem;margin:0 0 10px; color:var(--accent);font-weight: bold;}
label{display:block;text-align:left;font-size:.9rem;color:var(--muted);margin:0 0 6px}
input{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:13px 14px;margin-bottom:16px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{width:100%;font:inherit;font-weight:500;font-size:1.05rem;background:var(--accent);color:var(--bg);border:0;border-radius:6px;padding:14px;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#1d1a2b}}
#result{margin-top:36px;min-height:1px}
.hello{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.5rem;margin:0}
.table{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(2.5rem,12vw,4.4rem);line-height:1.1;color:var(--accent);margin:6px 0 0;animation:pop .35s ease-out}
.error{color:var(--muted);line-height:1.5}
.match{padding:18px 0;border-top:1px solid var(--line)}
.match:first-child{border-top:0}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.table{animation:none}}
</style>
</head>
<body>
<main>
  <h1>Dominique &amp; Claude</h1>

  <p class="intro">Trouvez votre table</p>

  <div role="search">
    <label for="nom">Nom</label>
    <input id="nom" type="text" autocomplete="family-name" enterkeyhint="search">
    <label for="prenom">Prénom</label>
    <input id="prenom" type="text" autocomplete="given-name" enterkeyhint="next">
    <button id="go" type="button">Voir ma table</button>

const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();

const $ = id => document.getElementById(id);
const out = $("result");

function search() {
  const p = norm($("prenom").value), n = norm($("nom").value);
  out.textContent = "";
  if (!p || !n) {
    out.innerHTML = '<p class="error">Merci de renseigner votre prénom et votre nom.</p>';
    return;
  }
  const found = INVITES.filter(([inn, ip]) => norm(ip) === p && norm(inn) === n);
  if (!found.length) {
    out.innerHTML = '<p class="error">Nous ne trouvons pas ce nom. Vérifiez l\'orthographe, ou demandez directement aux mariés.</p>';
    return;
  }
  found.forEach(([inn, ip, table]) => {
    const d = document.createElement("div");
    d.className = "match";
    const h = document.createElement("p");
    h.className = "hello";
    h.innerHTML = "Bienvenue " + ip + " ! <br>Vous êtes à la table...";
    const t = document.createElement("p");
    t.className = "table";
    t.textContent = table;
    d.append(h, t);
    out.append(d);
  });
}

$("go").addEventListener("click", search);
["prenom", "nom"].forEach(id => $(id).addEventListener("keydown", e => {
  if (e.key === "Enter") search();
}));
