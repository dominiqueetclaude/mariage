const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const nice = s => s.trim().toLowerCase().replace(/(^|[\s-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
const seen = new Set();
const INDEX = [];
INVITES.forEach(([n, p, t]) => {
  const id = norm(n) + "|" + norm(p) + "|" + t.trim();
  if (seen.has(id)) return;
  seen.add(id);
  INDEX.push({ n: nice(n), p: nice(p), t: t.trim(),
    keys: [norm(n), norm(n + " " + p), norm(p + " " + n)] });
});
const out = document.getElementById("result");

function message(text) {
  out.textContent = "";
  const p = document.createElement("p");
  p.className = "msg";
  p.textContent = text;
  out.append(p);
}

document.getElementById("searchForm").addEventListener("submit", e => {
  e.preventDefault();
  const q = norm(document.getElementById("surname").value);
  if (q.length < 3) return message("Entrez au moins les 3 premières lettres de votre nom.");
  const found = INDEX.filter(g => g.keys.some(k => k.startsWith(q)));
  if (!found.length) return message("Nous ne trouvons pas ce nom. Vérifiez l'orthographe, ou demandez aux mariés.");
  if (found.length > 10) return message("Plusieurs invités correspondent : ajoutez votre prénom (par exemple « Namer Paul »).");
  out.textContent = "";
  found.forEach(g => {
    const d = document.createElement("div");
    d.className = "guest";
    const w = document.createElement("p");
    w.className = "who";
    w.textContent = g.p + " " + g.n;
    const t = document.createElement("p");
    t.className = "tbl";
    t.textContent = g.t;
    d.append(w, t);
    out.append(d);
  });
});
